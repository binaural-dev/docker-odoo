<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reporte de horas — Resolución de tickets</title>
<style>
  @page { size: A4 landscape; margin: 1.5cm; }
  body { font-family: Arial, Helvetica, sans-serif; color: #222; max-width: 1280px; margin: 0 auto; padding: 24px; font-size: 11px; line-height: 1.45; }
  h1 { font-size: 15px; font-weight: 700; margin: 0 0 2px 0; }
  .sub { font-size: 12px; color: #444; margin-bottom: 18px; }
  .sub b { color: #111; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { background: #f0f0f0; text-align: left; padding: 6px 8px; font-size: 10px; font-weight: 700; border-bottom: 1.5px solid #333; white-space: nowrap; }
  td { padding: 6px 8px; border-bottom: 1px solid #ddd; vertical-align: top; font-size: 10px; }
  .c1 { width: 8%; }
  .c2 { width: 14%; }
  .c3 { width: 34%; }
  .c4 { width: 5%; text-align: center; }
  .c5 { width: 34%; }
  .c6 { width: 5%; text-align: center; }
  .ti { font-family: 'Courier New', monospace; font-weight: 700; font-size: 10px; }
  .tt { font-weight: 700; font-size: 10px; }
  .hr { text-align: center; font-weight: 700; font-size: 10px; }
  .no { color: #888; font-style: italic; }
  tr.total td { font-weight: 700; border-top: 2px solid #333; background: #f5f5f5; font-size: 11px; }
  tr.total .c3, tr.total .c5 { text-align: right; font-size: 10px; }
</style>
</head>
<body>

<h1>Reporte de horas — Resolución de tickets Post-Migración</h1>
<p class="sub">Período: <b>{{PERIODO}}</b> | Empleado: <b>{{EMPLEADO}}</b></p>

<table>
<thead>
<tr>
  <th class="c1">Nro TI / TA</th>
  <th class="c2">Título</th>
  <th class="c3">Descripción</th>
  <th class="c4">Con IA</th>
  <th class="c5">Mayor impacto sin IA</th>
  <th class="c6">Sin IA</th>
</tr>
</thead>
<tbody>

{{FILAS}}

<tr class="total">
  <td colspan="3" style="text-align:right;">TOTAL</td>
  <td class="hr">{{TOTAL_CON_IA}} h</td>
  <td></td>
  <td class="hr">{{TOTAL_SIN_IA}} h</td>
</tr>

</tbody>
</table>

</body>
</html>
