[options]
; Normally Odoo should run behind a proxy
proxy_mode = $PROXY_MODE
longpolling_port = $LONGPOLLING_PORT
gevent_port = $GEVENT_PORT
; Odoo 20.0 cambió el default de --http-interface a 127.0.0.1 (antes
; 0.0.0.0, ver odoo/tools/config.py de esa rama) -- sin esto, nginx (un
; contenedor separado) no puede alcanzar el puerto HTTP/gevent del
; contenedor Odoo por la red interna (solo quedaba escuchando en
; loopback). Explícito para toda versión: no-op en <20.0 (ya era el
; default ahí), requerido en 20.0+.
http_interface = 0.0.0.0
