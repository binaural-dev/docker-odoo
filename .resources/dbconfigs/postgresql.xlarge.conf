# =============================================================================
# PostgreSQL Profile: XLARGE
# =============================================================================
# Target: 20+ instancias Odoo compartiendo este postgres
# Hardware sugerido: 32GB+ RAM, 16+ CPU, SSD NVMe
# =============================================================================

hba_file = '/etc/postgres/dbconfigs/pg_hba.conf'
listen_addresses = '*'
port = 5432

# Memory Settings
shared_buffers = 8GB                          # ~25% RAM
effective_cache_size = 24GB                   # ~70% RAM
work_mem = 24MB
maintenance_work_mem = 2GB
huge_pages = off
min_wal_size = 4GB
max_wal_size = 16GB

# Process Settings
max_connections = 300                         # 20+ inst × ~12 conexiones activas
max_worker_processes = 16
max_parallel_workers = 16
max_parallel_workers_per_gather = 8

# WAL / Checkpoints
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_buffers = 64MB

# Disk access costs (NVMe SSD)
random_page_cost = 1.0
seq_page_cost = 1.0

# Logging & Monitoring
log_min_duration_statement = 500ms
shared_preload_libraries = 'pg_stat_statements'

# Planner
default_statistics_target = 200
effective_io_concurrency = 300

# Autovacuum
autovacuum = on
autovacuum_naptime = 1min
autovacuum_max_workers = 4
autovacuum_vacuum_cost_delay = 10ms
autovacuum_vacuum_cost_limit = 1000
autovacuum_work_mem = 1GB

# Write
synchronous_commit = on
