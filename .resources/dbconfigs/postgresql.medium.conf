# =============================================================================
# PostgreSQL Profile: MEDIUM
# =============================================================================
# Target: 4-10 instancias Odoo compartiendo este postgres
# Hardware sugerido: 8GB RAM, 4 CPU, SSD
# =============================================================================

hba_file = '/etc/postgres/dbconfigs/pg_hba.conf'
listen_addresses = '*'
port = 5432

# Memory Settings
shared_buffers = 2GB                          # ~25% RAM
effective_cache_size = 6GB                    # ~70% RAM
work_mem = 12MB
maintenance_work_mem = 512MB
huge_pages = off
min_wal_size = 1GB
max_wal_size = 4GB

# Process Settings
max_connections = 100                         # 4-10 inst × ~15 conexiones activas
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2

# WAL / Checkpoints
checkpoint_timeout = 20min
checkpoint_completion_target = 0.9
wal_buffers = 16MB

# Disk access costs (SSD)
random_page_cost = 1.1
seq_page_cost = 1.0

# Logging & Monitoring
log_min_duration_statement = 500ms
shared_preload_libraries = 'pg_stat_statements'

# Planner
default_statistics_target = 100
effective_io_concurrency = 200

# Autovacuum
autovacuum = on
autovacuum_naptime = 3min
autovacuum_max_workers = 2
autovacuum_vacuum_cost_delay = 20ms
autovacuum_vacuum_cost_limit = 500
autovacuum_work_mem = 384MB

# Write
synchronous_commit = on
