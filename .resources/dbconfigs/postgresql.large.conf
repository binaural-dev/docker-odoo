# =============================================================================
# PostgreSQL Profile: LARGE
# =============================================================================
# Target: 11-20 instancias Odoo compartiendo este postgres
# Hardware sugerido: 16GB RAM, 8 CPU, SSD
# =============================================================================

hba_file = '/etc/postgres/dbconfigs/pg_hba.conf'
listen_addresses = '*'
port = 5432

# Memory Settings
shared_buffers = 4GB                          # ~25% RAM
effective_cache_size = 12GB                   # ~70% RAM
work_mem = 16MB
maintenance_work_mem = 1GB
huge_pages = off
min_wal_size = 2GB
max_wal_size = 8GB

# Process Settings
max_connections = 200                         # 11-20 inst × ~12 conexiones activas
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4

# WAL / Checkpoints
checkpoint_timeout = 20min
checkpoint_completion_target = 0.9
wal_buffers = 32MB

# Disk access costs (SSD)
random_page_cost = 1.1
seq_page_cost = 1.0

# Logging & Monitoring
log_min_duration_statement = 500ms
shared_preload_libraries = 'pg_stat_statements'

# Planner
default_statistics_target = 200
effective_io_concurrency = 200

# Autovacuum
autovacuum = on
autovacuum_naptime = 1min
autovacuum_max_workers = 3
autovacuum_vacuum_cost_delay = 20ms
autovacuum_vacuum_cost_limit = 500
autovacuum_work_mem = 512MB

# Write
synchronous_commit = on
